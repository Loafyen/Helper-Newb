name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: railwayapp/cli-action@v3
        with:
          railwayToken: ${{ secrets.RAILWAY_TOKEN }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
